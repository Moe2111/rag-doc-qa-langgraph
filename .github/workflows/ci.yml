name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same pgvector version as the Azure server (0.8.7 on PostgreSQL 18).
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: docqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DOCQA_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/docqa_test
      DOCQA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -W error
