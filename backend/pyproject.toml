[project]
name = "docqa"
version = "0.1.0"
description = "Document Q&A with cited answers or an honest refusal: LangGraph + Postgres/pgvector"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    "langchain-core>=1.8,<2",
    "pypdf>=7.2.0",
    "langchain-text-splitters>=1.2.0",
    "boto3>=1.44.12",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langchain-anthropic>=1.7.13",
    "langchain-voyageai>=0.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.407",
    "pytest>=8.4",
    "httpx>=0.28",
    "import-linter>=2.5",
    "numpy>=2.5.5",  # required by langchain-core's DeterministicFakeEmbedding in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PIE", "RET", "TID"]
ignore = [
    "E501",
    "N818",  # domain errors are named for the condition (WorkspaceFull, ThreadNotFound): CODING_STANDARDS.md
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: needs a pgvector database at DOCQA_TEST_DATABASE_URL"]

[tool.importlinter]
root_package = "docqa"

[[tool.importlinter.contracts]]
name = "Layers: wiring > server > feature modules > corpus > domain"
type = "layers"
layers = [
    "docqa.wiring",
    "docqa.server",
    "docqa.library | docqa.answering | docqa.quota",
    "docqa.corpus",
    "docqa.domain",
]

[[tool.importlinter.contracts]]
name = "Only wiring reads settings"
type = "forbidden"
source_modules = [
    "docqa.server",
    "docqa.library",
    "docqa.answering",
    "docqa.quota",
    "docqa.corpus",
    "docqa.domain",
]
forbidden_modules = ["docqa.settings"]
